name: NuGet Pack and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to NuGet.org"
        required: false
        default: false
        type: boolean

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      package_id: ${{ steps.meta.outputs.package_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore VectorTileRenderer/VectorTileRenderer.csproj

      - name: Build
        run: dotnet build VectorTileRenderer/VectorTileRenderer.csproj -c Release --no-restore

      - name: Read package metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "VectorTileRenderer/VectorTileRenderer.csproj"
          $props = $xml.Project.PropertyGroup
          $versionFromProject = ($props | Where-Object { $_.Version } | Select-Object -First 1).Version
          $packageId = ($props | Where-Object { $_.PackageId } | Select-Object -First 1).PackageId

          $version = $versionFromProject
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $versionFromTag = $env:GITHUB_REF.Substring("refs/tags/v".Length)
            if ([string]::IsNullOrWhiteSpace($versionFromTag)) {
              throw "Unable to derive package version from tag '$env:GITHUB_REF'."
            }
            if ($versionFromTag -ne $versionFromProject) {
              throw "Version mismatch: tag '$versionFromTag' does not match project version '$versionFromProject' in VectorTileRenderer.csproj."
            }
            $version = $versionFromTag
          }

          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_id=$packageId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Export curated release notes
        shell: pwsh
        run: |
          [xml]$project = Get-Content "VectorTileRenderer/VectorTileRenderer.csproj" -Raw
          $notes = [string]($project.Project.PropertyGroup | Where-Object { $_.PackageReleaseNotes } | Select-Object -First 1).PackageReleaseNotes
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "PackageReleaseNotes is required." }
          Set-Content "release-notes.md" -Value $notes -Encoding utf8

      - name: Pack and verify release metadata
        shell: pwsh
        run: |
          dotnet pack VectorTileRenderer/VectorTileRenderer.csproj -c Release --no-build -o artifacts
          if ($LASTEXITCODE -ne 0) { throw "Package creation failed." }

          [xml]$project = Get-Content "VectorTileRenderer/VectorTileRenderer.csproj" -Raw
          $properties = $project.Project.PropertyGroup | Where-Object { $_.PackageId } | Select-Object -First 1
          $packagePath = "artifacts/$($properties.PackageId).$($properties.Version).nupkg"
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagePath))
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName.EndsWith(".nuspec") } | Select-Object -First 1
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest.package.metadata.version -ne $properties.Version) { throw "Packed version mismatch." }
            if ($manifest.package.metadata.releaseNotes -cne $properties.PackageReleaseNotes) { throw "Packed release notes differ from the project." }
            $readme = $archive.GetEntry([string]$manifest.package.metadata.readme)
            if ($null -eq $readme) { throw "Package README is missing." }
            $reader = [System.IO.StreamReader]::new($readme.Open())
            try { $readmeText = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if (!$readmeText.Contains([string]$properties.Version)) { throw "Update the package README release notes for this version." }
          } finally { $archive.Dispose() }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push NuGet package
        shell: bash
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Push package to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push symbol package
        shell: bash
        run: |
          shopt -s nullglob
          SYMBOLS=(artifacts/*.snupkg)
          if [ ${#SYMBOLS[@]} -gt 0 ]; then
            dotnet nuget push "artifacts/*.snupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate
          fi
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
